<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Offline · Symphony</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0a0a0a;
        padding: 24px;
      }
      .card { max-width: 420px; text-align: center; }
      .badge {
        width: 56px; height: 56px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 16px; background: #0a0a0a; color: #ffffff;
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: #666; font-size: 14px; line-height: 1.6; }
      button {
        height: 42px; padding: 0 20px; border-radius: 10px; border: none;
        background: #0a0a0a; color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer;
      }
      button:hover { opacity: 0.88; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M4 7h16M4 12h10M4 17h6" />
          <circle cx="18" cy="16" r="3" fill="currentColor" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>Symphony needs a connection to drive cloud browsers and fetch live data. Cached pages are still available.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
